name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [coffee, crud, realworld]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Syntax check
        run: find ${{ matrix.app }}/app ${{ matrix.app }}/routes ${{ matrix.app }}/database -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Validate composer.json
        run: composer validate --no-check-lock --no-check-publish -d ${{ matrix.app }}

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp -r envs.example envs
      - run: docker compose config -q

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [coffee, crud, realworld]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.app }}/Dockerfile
          failure-threshold: error

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0" # report-only; flip to "1" once findings are triaged
